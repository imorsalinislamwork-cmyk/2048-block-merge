// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    def targetJava = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)
        ? JavaVersion.VERSION_21
        : JavaVersion.VERSION_17

    subproject.plugins.withId('com.android.library') {
        subproject.androidComponents {
            finalizeDsl { ext ->
                ext.compileOptions.sourceCompatibility = targetJava
                ext.compileOptions.targetCompatibility = targetJava
            }
        }
    }

    subproject.plugins.withId('com.android.application') {
        subproject.androidComponents {
            finalizeDsl { ext ->
                ext.compileOptions.sourceCompatibility = targetJava
                ext.compileOptions.targetCompatibility = targetJava
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
