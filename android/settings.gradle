include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File(settingsDir, 'capacitor-cordova-android-plugins')

apply from: 'capacitor.settings.gradle'

[':capacitor-android', ':capacitor-app', ':capacitor-splash-screen'].each { name ->
    def proj = findProject(name)
    if (proj != null && !proj.projectDir.exists()) {
        def resolved = new File(settingsDir, proj.projectDir.path)
        if (resolved.exists()) {
            proj.projectDir = resolved
        }
    }
}